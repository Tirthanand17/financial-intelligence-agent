name: Scheduled operational cycle

on:
  schedule:
    - cron: '0 4 * * *' # 09:30 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financial-intelligence-scheduled-operation
  cancel-in-progress: false

jobs:
  scheduled-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_REGION: ${{ vars.S3_REGION }}
      MONITOR_SUPABASE_MAX_MB: ${{ vars.MONITOR_SUPABASE_MAX_MB }}
      MONITOR_B2_MAX_MB: ${{ vars.MONITOR_B2_MAX_MB }}
      MONITOR_QDRANT_MAX_POINTS: ${{ vars.MONITOR_QDRANT_MAX_POINTS }}
      MONITOR_CAPACITY_LOW_WATERMARK_PERCENT: ${{ vars.MONITOR_CAPACITY_LOW_WATERMARK_PERCENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Require explicit cloud configuration
        shell: bash
        run: |
          missing=0
          required=(DATABASE_URL QDRANT_URL QDRANT_API_KEY S3_ENDPOINT_URL S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET S3_REGION MONITOR_SUPABASE_MAX_MB MONITOR_B2_MAX_MB MONITOR_QDRANT_MAX_POINTS MONITOR_CAPACITY_LOW_WATERMARK_PERCENT)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Actions secret/variable: ${name}"
              missing=1
            fi
          done
          test "${missing}" -eq 0

      - name: Fail-closed pre-run readiness
        env:
          SOURCE_MONITORING_ENABLED: "false"
          SOURCE_AUTO_INGEST_ENABLED: "false"
          TRUST_PROMOTION_ENABLED: "false"
        run: |
          python scripts/phase17_production_readiness.py | tee /tmp/pre-readiness.log
          grep -q '^FINAL: PASS-READ-ONLY' /tmp/pre-readiness.log

      - name: Run bounded source cycles sequentially
        shell: bash
        env:
          SOURCE_MONITORING_ENABLED: "true"
          SOURCE_AUTO_INGEST_ENABLED: "true"
          TRUST_PROMOTION_ENABLED: "false"
        run: |
          monitors=(
            rbi-press-releases-rss
            sebi-rss
            nse-daily-buyback-rss
            mospi-latest-releases-api
          )
          for monitor in "${monitors[@]}"; do
            echo "Running bounded cycle for ${monitor}"
            python scripts/phase14_integrated_cycle_canary.py \
              --monitor-id "${monitor}" \
              --processing-limit 1 \
              --allow-network \
              --allow-write | tee "/tmp/${monitor}.log"
            grep -Eq '^FINAL: PASS-(COMMITTED|MONITOR-ONLY|NOT-DUE)' "/tmp/${monitor}.log"
          done

      - name: Fail-closed post-run readiness
        env:
          SOURCE_MONITORING_ENABLED: "false"
          SOURCE_AUTO_INGEST_ENABLED: "false"
          TRUST_PROMOTION_ENABLED: "false"
        run: |
          python scripts/phase17_production_readiness.py | tee /tmp/post-readiness.log
          grep -q '^FINAL: PASS-READ-ONLY' /tmp/post-readiness.log
