name: Scheduled operational cycle

on:
  schedule:
    - cron: '30 9 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financial-intelligence-scheduled-operation
  cancel-in-progress: false

jobs:
  scheduled-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONPATH: .
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_REGION: ${{ vars.S3_REGION }}
      MONITOR_SUPABASE_MAX_MB: ${{ vars.MONITOR_SUPABASE_MAX_MB }}
      MONITOR_B2_MAX_MB: ${{ vars.MONITOR_B2_MAX_MB }}
      MONITOR_QDRANT_MAX_POINTS: ${{ vars.MONITOR_QDRANT_MAX_POINTS }}
      MONITOR_CAPACITY_LOW_WATERMARK_PERCENT: ${{ vars.MONITOR_CAPACITY_LOW_WATERMARK_PERCENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Require explicit cloud configuration
        shell: bash
        run: |
          missing=0
          required=(DATABASE_URL QDRANT_URL QDRANT_API_KEY S3_ENDPOINT_URL S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET S3_REGION MONITOR_SUPABASE_MAX_MB MONITOR_B2_MAX_MB MONITOR_QDRANT_MAX_POINTS MONITOR_CAPACITY_LOW_WATERMARK_PERCENT)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Actions secret/variable: ${name}"
              missing=1
            fi
          done
          test "${missing}" -eq 0

      - name: Fail-closed pre-run readiness
        env:
          SOURCE_MONITORING_ENABLED: "false"
          SOURCE_AUTO_INGEST_ENABLED: "false"
          TRUST_PROMOTION_ENABLED: "false"
        run: |
          python scripts/phase17_production_readiness.py | tee /tmp/pre-readiness.log
          grep -q '^FINAL: PASS-READ-ONLY' /tmp/pre-readiness.log

      - name: Run bounded source cycles sequentially
        shell: bash
        env:
          SOURCE_MONITORING_ENABLED: "true"
          SOURCE_AUTO_INGEST_ENABLED: "true"
          TRUST_PROMOTION_ENABLED: "false"
        run: |
          monitors=(
            rbi-press-releases-rss
            sebi-rss
            nse-daily-buyback-rss
            mospi-latest-releases-api
          )
          for monitor in "${monitors[@]}"; do
            echo "Running bounded cycle for ${monitor}"
            python scripts/phase14_integrated_cycle_canary.py \
              --monitor-id "${monitor}" \
              --processing-limit 1 \
              --allow-network \
              --allow-write | tee "/tmp/${monitor}.log"
            grep -Eq '^FINAL: PASS-(COMMITTED|MONITOR-ONLY|NOT-DUE)' "/tmp/${monitor}.log"
          done

          echo "Running bounded source-specific World Bank cycle"
          python scripts/world_bank_operational_cycle.py \
            --allow-network \
            --allow-write | tee /tmp/world-bank-india-gdp-api.log
          grep -Eq '^FINAL: PASS-(COMMITTED|NO-CHANGE|NOT-DUE)' /tmp/world-bank-india-gdp-api.log

      - name: Fail-closed post-run readiness
        env:
          SOURCE_MONITORING_ENABLED: "false"
          SOURCE_AUTO_INGEST_ENABLED: "false"
          TRUST_PROMOTION_ENABLED: "false"
        run: |
          python scripts/phase17_production_readiness.py | tee /tmp/post-readiness.log
          grep -q '^FINAL: PASS-READ-ONLY' /tmp/post-readiness.log

  operational-failure-alert:
    name: Record operational failure alert
    needs: scheduled-cycle
    if: ${{ always() && needs.scheduled-cycle.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update deduplicated incident issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[Operational Alert] Scheduled financial-intelligence cycle failed';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const timestamp = new Date().toISOString();
            const marker = '<!-- financial-intelligence-scheduled-failure -->';
            const event = context.eventName;
            const ref = context.ref;
            const sha = context.sha;
            const body = [
              marker,
              'The bounded scheduled operational cycle failed and requires operator review.',
              '',
              `- detected_at_utc: ${timestamp}`,
              `- workflow_run: ${runUrl}`,
              `- event: ${event}`,
              `- ref: ${ref}`,
              `- commit: ${sha}`,
              `- run_attempt: ${context.runAttempt}`,
              '',
              'No provider credentials, raw exception payloads, evidence bytes, or private object keys are copied into this alert.',
              'Do not increase cadence or bypass readiness checks to recover. Review the failed workflow and preserve the fail-closed state.'
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(
              issue => !issue.pull_request && issue.title === title && (issue.body || '').includes(marker)
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
              core.info(`Updated operational alert issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
              core.info(`Created operational alert issue #${created.data.number}`);
            }
