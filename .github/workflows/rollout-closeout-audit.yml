name: Initial scheduler rollout closeout audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: financial-intelligence-rollout-closeout-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_REGION: ${{ vars.S3_REGION }}
      MONITOR_SUPABASE_MAX_MB: ${{ vars.MONITOR_SUPABASE_MAX_MB }}
      MONITOR_B2_MAX_MB: ${{ vars.MONITOR_B2_MAX_MB }}
      MONITOR_QDRANT_MAX_POINTS: ${{ vars.MONITOR_QDRANT_MAX_POINTS }}
      MONITOR_CAPACITY_LOW_WATERMARK_PERCENT: ${{ vars.MONITOR_CAPACITY_LOW_WATERMARK_PERCENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit seven scheduled observation days
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'operational-scheduled.yml';
            const requiredDates = [
              '2026-09-14',
              '2026-09-15',
              '2026-09-16',
              '2026-09-17',
              '2026-09-18',
              '2026-09-19',
              '2026-09-20'
            ];

            function istDate(iso) {
              const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Kolkata',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
              }).formatToParts(new Date(iso));
              const values = Object.fromEntries(parts.map(p => [p.type, p.value]));
              return `${values.year}-${values.month}-${values.day}`;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id,
              event: 'schedule',
              per_page: 100
            });

            const rows = [];
            const blockers = [];
            for (const date of requiredDates) {
              const daily = runs
                .filter(run => istDate(run.created_at) === date)
                .sort((a, b) => a.created_at.localeCompare(b.created_at));
              const conclusions = daily.map(run => run.conclusion || run.status);
              const runLinks = daily.map(run => `[${run.id}](${run.html_url})`).join(', ');
              const allSuccessful = daily.length > 0 && daily.every(run => run.conclusion === 'success');

              rows.push([
                {data: date, header: false},
                allSuccessful ? 'PASS' : 'BLOCKED',
                conclusions.join(', ') || 'missing',
                runLinks || '-'
              ]);

              if (!daily.length) {
                blockers.push(`${date}: missing scheduled run`);
              } else if (!allSuccessful) {
                blockers.push(`${date}: non-success scheduled run (${conclusions.join(', ')})`);
              }
            }

            await core.summary
              .addHeading('Initial scheduler rollout observation history')
              .addTable([
                [
                  {data: 'IST date', header: true},
                  {data: 'Status', header: true},
                  {data: 'Conclusion(s)', header: true},
                  {data: 'Run(s)', header: true}
                ],
                ...rows
              ])
              .addRaw('\nThis audit is read-only and does not change cadence, sources, gates, trust, evidence, or storage.\n')
              .write();

            if (blockers.length) {
              core.setFailed(`Rollout closeout blocked: ${blockers.join('; ')}`);
            }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Require explicit cloud configuration
        shell: bash
        run: |
          missing=0
          required=(DATABASE_URL QDRANT_URL QDRANT_API_KEY S3_ENDPOINT_URL S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET S3_REGION MONITOR_SUPABASE_MAX_MB MONITOR_B2_MAX_MB MONITOR_QDRANT_MAX_POINTS MONITOR_CAPACITY_LOW_WATERMARK_PERCENT)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Actions secret/variable: ${name}"
              missing=1
            fi
          done
          test "${missing}" -eq 0

      - name: Run current fail-closed production readiness
        env:
          SOURCE_MONITORING_ENABLED: "false"
          SOURCE_AUTO_INGEST_ENABLED: "false"
          TRUST_PROMOTION_ENABLED: "false"
        run: |
          python scripts/phase17_production_readiness.py | tee /tmp/rollout-closeout-readiness.log
          grep -q '^FINAL: PASS-READ-ONLY' /tmp/rollout-closeout-readiness.log

      - name: Closeout audit result
        run: echo 'FINAL: ROLLOUT-CLOSEOUT-READY'
