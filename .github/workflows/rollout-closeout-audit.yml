name: Initial scheduler rollout closeout audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financial-intelligence-rollout-closeout-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      PYTHONPATH: .
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_REGION: ${{ vars.S3_REGION }}
      MONITOR_SUPABASE_MAX_MB: ${{ vars.MONITOR_SUPABASE_MAX_MB }}
      MONITOR_B2_MAX_MB: ${{ vars.MONITOR_B2_MAX_MB }}
      MONITOR_QDRANT_MAX_POINTS: ${{ vars.MONITOR_QDRANT_MAX_POINTS }}
      MONITOR_CAPACITY_LOW_WATERMARK_PERCENT: ${{ vars.MONITOR_CAPACITY_LOW_WATERMARK_PERCENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Capture scheduled-run history
        id: rollout_history
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'operational-scheduled.yml',
              event: 'schedule',
              per_page: 100
            });
            const compact = runs.slice(0, 1000).map((row) => ({
              id: row.id,
              event: row.event,
              created_at: row.created_at,
              status: row.status,
              conclusion: row.conclusion,
              html_url: row.html_url
            }));
            return JSON.stringify(compact);

      - name: Audit seven scheduled observation days
        env:
          ROLLOUT_RUNS_JSON: ${{ steps.rollout_history.outputs.result }}
        run: python scripts/rollout_closeout_history.py

      - name: Require explicit cloud configuration
        shell: bash
        run: |
          missing=0
          required=(DATABASE_URL QDRANT_URL QDRANT_API_KEY S3_ENDPOINT_URL S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET S3_REGION MONITOR_SUPABASE_MAX_MB MONITOR_B2_MAX_MB MONITOR_QDRANT_MAX_POINTS MONITOR_CAPACITY_LOW_WATERMARK_PERCENT)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Actions secret/variable: ${name}"
              missing=1
            fi
          done
          test "${missing}" -eq 0

      - name: Run current fail-closed production readiness
        env:
          SOURCE_MONITORING_ENABLED: "false"
          SOURCE_AUTO_INGEST_ENABLED: "false"
          TRUST_PROMOTION_ENABLED: "false"
        run: |
          python scripts/phase17_production_readiness.py | tee /tmp/rollout-closeout-readiness.log
          grep -q '^FINAL: PASS-READ-ONLY' /tmp/rollout-closeout-readiness.log

      - name: Closeout audit result
        run: echo 'FINAL: ROLLOUT-CLOSEOUT-READY'
