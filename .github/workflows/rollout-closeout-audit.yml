name: Initial scheduler rollout closeout audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financial-intelligence-rollout-closeout-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Validation baseline
        run: echo 'rollout-closeout-workflow-valid'
