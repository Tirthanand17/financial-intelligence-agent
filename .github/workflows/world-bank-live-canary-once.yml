name: One-shot World Bank live canary

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: world-bank-live-canary-once
  cancel-in-progress: false

jobs:
  world-bank-live-canary:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 68 &&
      github.event.comment.user.login == 'Tirthanand17' &&
      github.event.comment.body == '/run-world-bank-live-canary-2026-09-20'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_REGION: ${{ vars.S3_REGION }}
      MONITOR_SUPABASE_MAX_MB: ${{ vars.MONITOR_SUPABASE_MAX_MB }}
      MONITOR_B2_MAX_MB: ${{ vars.MONITOR_B2_MAX_MB }}
      MONITOR_QDRANT_MAX_POINTS: ${{ vars.MONITOR_QDRANT_MAX_POINTS }}
      MONITOR_CAPACITY_LOW_WATERMARK_PERCENT: ${{ vars.MONITOR_CAPACITY_LOW_WATERMARK_PERCENT }}
      SOURCE_MONITORING_ENABLED: "false"
      SOURCE_AUTO_INGEST_ENABLED: "false"
      TRUST_PROMOTION_ENABLED: "false"

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Require explicit cloud configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          required=(DATABASE_URL QDRANT_URL QDRANT_API_KEY S3_ENDPOINT_URL S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET S3_REGION MONITOR_SUPABASE_MAX_MB MONITOR_B2_MAX_MB MONITOR_QDRANT_MAX_POINTS MONITOR_CAPACITY_LOW_WATERMARK_PERCENT)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Actions secret/variable: ${name}"
              missing=1
            fi
          done
          test "${missing}" -eq 0

      - name: Require recorded rollout closeout
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FINAL: ROLLOUT-CLOSEOUT-READY' docs/INITIAL_SCHEDULER_ROLLOUT_CLOSEOUT_AUDIT.md

      - name: Fail-closed pre-canary readiness
        shell: bash
        run: |
          set -euo pipefail
          python scripts/phase17_production_readiness.py | tee /tmp/world-bank-pre-readiness.log
          grep -q '^FINAL: PASS-READ-ONLY' /tmp/world-bank-pre-readiness.log

      - name: Run exactly one bounded World Bank canary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/world_bank_live_canary.py \
            --indicator-code NY.GDP.MKTP.KD.ZG \
            --recent-observations 3 \
            --allow-network \
            --allow-write \
            --confirm WORLD_BANK_LIVE_CANARY | tee /tmp/world-bank-canary.json

      - name: Validate canary contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          result = json.loads(Path('/tmp/world-bank-canary.json').read_text(encoding='utf-8'))
          if result.get('live_canary_performed') is not True:
              raise SystemExit('World Bank live canary did not report live_canary_performed=true')
          if result.get('indicator_code') != 'NY.GDP.MKTP.KD.ZG':
              raise SystemExit('World Bank live canary returned an unexpected indicator')
          if result.get('status') not in {'indexed', 'already_indexed'}:
              raise SystemExit('World Bank live canary did not finish reconciled/indexed')
          if result.get('claim_count') != 0:
              raise SystemExit('World Bank live canary unexpectedly created structured claims')
          chunk_count = result.get('chunk_count')
          periods = result.get('observation_periods')
          if not isinstance(chunk_count, int) or not 1 <= chunk_count <= 3:
              raise SystemExit('World Bank live canary chunk count is outside the bounded contract')
          if not isinstance(periods, list) or len(periods) != chunk_count:
              raise SystemExit('World Bank live canary observation periods do not reconcile to chunks')
          digest = result.get('sha256')
          if not isinstance(digest, str) or re.fullmatch(r'[0-9a-f]{64}', digest) is None:
              raise SystemExit('World Bank live canary SHA-256 is invalid')
          document_id = result.get('document_id')
          if not isinstance(document_id, str) or not document_id:
              raise SystemExit('World Bank live canary document id is missing')

          summary = [
              '## World Bank bounded live canary',
              '',
              f"- status: `{result['status']}`",
              f"- indicator: `{result['indicator_code']}`",
              f"- sha256: `{result['sha256']}`",
              f"- document_id: `{result['document_id']}`",
              f"- chunk_count: `{result['chunk_count']}`",
              f"- claim_count: `{result['claim_count']}`",
              f"- observation_periods: `{', '.join(result['observation_periods'])}`",
              f"- source_last_updated: `{result.get('source_last_updated') or 'unknown'}` (metadata only; not a claim date)",
              '',
              'No publication/effective date was inferred from annual observation periods or source metadata.',
          ]
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(summary) + '\n', encoding='utf-8')
          PY

      - name: Fail-closed post-canary readiness
        shell: bash
        run: |
          set -euo pipefail
          python scripts/phase17_production_readiness.py | tee /tmp/world-bank-post-readiness.log
          grep -q '^FINAL: PASS-READ-ONLY' /tmp/world-bank-post-readiness.log
