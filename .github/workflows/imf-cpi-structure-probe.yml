name: IMF CPI structure probe

on:
  push:
    branches:
      - research/imf-cpi-live-contract
    paths:
      - scripts/imf_cpi_structure_probe.py
      - .github/workflows/imf-cpi-structure-probe.yml

permissions:
  contents: read

concurrency:
  group: imf-cpi-structure-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install probe dependency
        run: python -m pip install 'httpx==0.28.1'

      - name: Probe fixed IMF CPI public structures
        run: python scripts/imf_cpi_structure_probe.py
